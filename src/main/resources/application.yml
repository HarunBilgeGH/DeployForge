spring:
  application:
    name: deployforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deployforge}
    username: ${DB_USERNAME:deployforge}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
deployforge:
  bootstrap:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
