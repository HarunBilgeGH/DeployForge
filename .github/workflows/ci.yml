name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, web ve PostgreSQL entegrasyon testleri
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -P integration-test verify
      - name: Docker derleme kontrolü
        run: docker build -t deployforge:ci .
