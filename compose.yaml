services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: deployforge
      POSTGRES_USER: ${DB_USERNAME:-deployforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: ["app"]
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/deployforge
      DB_USERNAME: ${DB_USERNAME:-deployforge}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME tanımlanmalı}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD tanımlanmalı}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
